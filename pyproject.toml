[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blastlab"
dynamic = ["version"]
description = "Blast wave simulation desktop app: native numpy 1D/2D/3D solvers and a blastFoam (WSL) backend"
readme = "blastlab/README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.8",
    "pillow>=10",
    "PySide6>=6.11,<7",
    "pyqtgraph>=0.14",
]

[project.optional-dependencies]
viewer3d = ["pyvista>=0.44", "pyvistaqt>=0.13"]
tk = ["customtkinter>=5.2"]

[project.scripts]
blastlab = "blastlab.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "blastlab.__version__"}

[tool.setuptools.packages.find]
include = ["blastlab*"]
